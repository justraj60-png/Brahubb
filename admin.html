<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAHUBB Admin</title>
<style>body{font-family:Arial;margin:0;background:#f5f5f5;color:#111}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.box{background:#fff;padding:18px;border-radius:10px;margin:15px 0}.field{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:6px}.btn{padding:10px 14px;border:0;border-radius:6px;background:#111;color:#fff;font-weight:700}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #ddd;text-align:left}select{padding:8px}.note{color:#666}</style></head>
<body><div class="wrap"><div class="top"><h1>BRAHUBB Admin</h1><a href="index.html">Store</a></div>
<div class="box"><h2>Setup</h2><p class="note">Paste the same Supabase URL and anon key below. This page reads real orders/products from the database.</p><input id="url" class="field" placeholder="Supabase URL"><input id="key" class="field" placeholder="Supabase anon key"><button class="btn" onclick="saveSetup()">Save & Load</button></div>
<div class="box"><h2>Add Product</h2><input id="name" class="field" placeholder="Product name"><input id="cat" class="field" placeholder="Category"><input id="price" class="field" type="number" placeholder="Price"><input id="mrp" class="field" type="number" placeholder="MRP"><input id="img" class="field" placeholder="Image URL"><button class="btn" onclick="addProduct()">Add Product</button></div>
<div class="box"><h2>Orders</h2><div id="orders">Connect Supabase to load orders.</div></div><div class="box"><h2>Products</h2><div id="products">Connect Supabase to load products.</div></div></div>
<script>
let URLS=localStorage.brahubbURL||"",KEY=localStorage.brahubbKEY||"";url.value=URLS;key.value=KEY;
function headers(){return {apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"}}
function saveSetup(){URLS=url.value.trim();KEY=key.value.trim();localStorage.brahubbURL=URLS;localStorage.brahubbKEY=KEY;load()}
async function addProduct(){if(!URLS||!KEY)return alert("Setup Supabase first");let body={name:name.value,category:cat.value,price:Number(price.value),mrp:Number(mrp.value||price.value),image:img.value,active:true};let r=await fetch(URLS+"/rest/v1/products",{method:"POST",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify(body)});alert(r.ok?"Product added":"Could not add product");if(r.ok)load()}
async function setStatus(id,status){await fetch(URLS+"/rest/v1/orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify({status})});load()}
async function load(){if(!URLS||!KEY)return;let [or,pr]=await Promise.all([fetch(URLS+"/rest/v1/orders?select=*&order=created_at.desc",{headers:headers()}),fetch(URLS+"/rest/v1/products?select=*&order=created_at.desc",{headers:headers()})]);let orders=await or.json(),products=await pr.json();document.getElementById("orders").innerHTML=orders.length?`<table class="table"><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th></tr>`+orders.map(o=>`<tr><td>${o.order_no}</td><td>${o.customer_name}<br>${o.address}</td><td>${o.phone}</td><td>₹${o.total}</td><td><select onchange="setStatus('${o.id}',this.value)">${["pending","confirmed","packed","shipped","delivered","cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")+"</table>":"No orders yet.";document.getElementById("products").innerHTML=products.length?`<table class="table"><tr><th>Name</th><th>Category</th><th>Price</th></tr>`+products.map(p=>`<tr><td>${p.name}</td><td>${p.category}</td><td>₹${p.price}</td></tr>`).join("")+"</table>":"No products yet."}
load();
</script></body></html>
