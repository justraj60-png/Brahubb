<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brahubb | Online Shopping</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:15px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:30px;
  font-weight:bold;
  letter-spacing:1px;
}

.search{
  flex:1;
  max-width:500px;
}

.search input{
  width:100%;
  padding:13px 18px;
  border:none;
  border-radius:25px;
  outline:none;
  font-size:15px;
}

.cart-btn{
  background:white;
  color:#111;
  border:none;
  padding:12px 18px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111,#444);
  color:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  font-size:44px;
  margin-bottom:12px;
}

.hero p{
  font-size:18px;
}

.categories{
  padding:25px 5%;
  display:flex;
  gap:10px;
  overflow-x:auto;
  background:white;
}

.category{
  border:1px solid #ddd;
  background:white;
  padding:10px 18px;
  border-radius:25px;
  white-space:nowrap;
  cursor:pointer;
}

.category.active,
.category:hover{
  background:#111;
  color:white;
}

.products{
  padding:35px 5%;
}

.products h2{
  text-align:center;
  margin-bottom:25px;
  font-size:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  padding-bottom:18px;
}

.pic{
  height:190px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.info{
  padding:16px;
}

.category-name{
  color:#777;
  font-size:13px;
}

.card h3{
  margin:7px 0;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}

.buy{
  width:100%;
  padding:11px;
  border:none;
  border-radius:22px;
  background:#111;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.cart-box{
  display:none;
  background:white;
  margin:25px 5%;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 15px #ddd;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin-top:20px;
}

.whatsapp{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:none;
  border-radius:25px;
  background:#25D366;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:30px;
  margin-top:30px;
}

@media(max-width:650px){
  header{
    flex-wrap:wrap;
  }

  .logo{
    font-size:25px;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero h1{
    font-size:35px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">BRAHUBB</div>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="Search products..."
      onkeyup="searchProducts()"
    >
  </div>

  <button class="cart-btn" onclick="showCart()">
    🛒 Cart (<span id="count">0</span>)
  </button>

</header>

<section class="hero">
  <h1>Welcome to Brahubb</h1>
  <p>Everything you need, all in one place.</p>
</section>

<div class="categories">

  <button class="category active" onclick="filterProducts('All',this)">
    All
  </button>

  <button class="category" onclick="filterProducts('Electronics',this)">
    📱 Electronics
  </button>

  <button class="category" onclick="filterProducts('Fashion',this)">
    👕 Fashion
  </button>

  <button class="category" onclick="filterProducts('Shoes',this)">
    👟 Shoes
  </button>

  <button class="category" onclick="filterProducts('Beauty',this)">
    💄 Beauty
  </button>

  <button class="category" onclick="filterProducts('Home',this)">
    🏠 Home
  </button>

  <button class="category" onclick="filterProducts('Bags',this)">
    🎒 Bags
  </button>

</div>

<section class="products">

<h2>Featured Products</h2>

<div class="grid" id="products"></div>

</section>

<div class="cart-box" id="cartBox">

  <h2>🛒 Your Cart</h2>

  <div id="cartItems"></div>

  <div class="total">
    Total: ₹<span id="total">0</span>
  </div>

  <button class="whatsapp" onclick="orderWhatsApp()">
    📱 Order on WhatsApp
  </button>

</div>

<footer>

  <h2>BRAHUBB</h2>
  <p>Shop smart. Shop Brahubb.</p>
  <br>
  <p>© 2026 Brahubb. All rights reserved.</p>

</footer>

<script>

const products = [

{
name:"Smartphone",
category:"Electronics",
price:19999,
icon:"📱"
},

{
name:"Wireless Earbuds",
category:"Electronics",
price:1499,
icon:"🎧"
},

{
name:"Smart Watch",
category:"Electronics",
price:2499,
icon:"⌚"
},

{
name:"Bluetooth Speaker",
category:"Electronics",
price:1799,
icon:"🔊"
},

{
name:"Men's T-Shirt",
category:"Fashion",
price:599,
icon:"👕"
},

{
name:"Women's Dress",
category:"Fashion",
price:999,
icon:"👗"
},

{
name:"Denim Jacket",
category:"Fashion",
price:1499,
icon:"🧥"
},

{
name:"Running Shoes",
category:"Shoes",
price:1799,
icon:"👟"
},

{
name:"Casual Sneakers",
category:"Shoes",
price:1299,
icon:"👞"
},

{
name:"Beauty Kit",
category:"Beauty",
price:799,
icon:"💄"
},

{
name:"Perfume",
category:"Beauty",
price:699,
icon:"🌸"
},

{
name:"Face Care Kit",
category:"Beauty",
price:899,
icon:"🧴"
},

{
name:"Kitchen Set",
category:"Home",
price:1299,
icon:"🍳"
},

{
name:"LED Lamp",
category:"Home",
price:599,
icon:"💡"
},

{
name:"Bedsheet",
category:"Home",
price:799,
icon:"🛏️"
},

{
name:"Travel Backpack",
category:"Bags",
price:999,
icon:"🎒"
},

{
name:"Handbag",
category:"Bags",
price:899,
icon:"👜"
},

{
name:"Wallet",
category:"Bags",
price:399,
icon:"👛"
}

];

let cart=[];

let currentCategory="All";

function displayProducts(list){

const box=document.getElementById("products");

box.innerHTML="";

if(list.length===0){

box.innerHTML="<p>No products found.</p>";

return;

}

list.forEach((p,index)=>{

box.innerHTML+=`

<div class="card">

<div class="pic">
${p.icon}
</div>

<div class="info">

<div class="category-name">
${p.category}
</div>

<h3>${p.name}</h3>

<div class="price">
₹${p.price.toLocaleString("en-IN")}
</div>

<button class="buy"
onclick="addCart(${index})">
Add to Cart
</button>

</div>

</div>

`;

});

}

function addCart(index){

const visible=getVisibleProducts();

cart.push(visible[index]);

document.getElementById("count").innerText=cart.length;

alert(visible[index].name+" added to cart!");

}

function getVisibleProducts(){

let list=products;

if(currentCategory!=="All"){

list=list.filter(
p=>p.category===currentCategory
);

}

const search=document
.getElementById("search")
.value
.toLowerCase();

if(search){

list=list.filter(
p=>p.name.toLowerCase().includes(search)
);

}

return list;

}

function filterProducts(category,button){

currentCategory=category;

document
.querySelectorAll(".category")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

displayProducts(getVisibleProducts());

}

function searchProducts(){

displayProducts(getVisibleProducts());

}

function showCart(){

const box=document.getElementById("cartBox");

box.style.display="block";

const items=document.getElementById("cartItems");

items.innerHTML="";

let total=0;

if(cart.length===0){

items.innerHTML="<p>Your cart is empty.</p>";

document.getElementById("total").innerText="0";

return;

}

cart.forEach((item,index)=>{

total+=item.price;

items.innerHTML+=`

<div class="cart-item">

<span>
${item.name}
</span>

<span>
₹${item.price.toLocaleString("en-IN")}
</span>

</div>

`;

});

document.getElementById("total").innerText=
total.toLocaleString("en-IN");

}

function orderWhatsApp(){

if(cart.length===0){

alert("Your cart is empty!");

return;

}

let message=
"Hello Brahubb!%0A%0AI want to order:%0A";

let total=0;

cart.forEach(item=>{

message+=
"- "+
item.name+
" - ₹"+
item.price+
"%0A";

total+=item.price;

});

message+=
"%0ATotal: ₹"+
total+
"%0A%0APlease confirm my order.";

window.open(
"https://wa.me/918541979145?text="+message,
"_blank"
);

}

displayProducts(products);

</script>

</body>
</html>
