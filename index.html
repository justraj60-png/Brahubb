const grid=document.getElementById('grid'),q=document.getElementById('q'),sort=document.getElementById('sort');
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{active=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
q.oninput=render;sort.onchange=render;
function render(){
 let s=q.value.toLowerCase(),a=products.filter(p=>(active==='All'||p.category===active)&&(!s||(p.name+' '+p.category).toLowerCase().includes(s)));
 if(sort.value==='low')a.sort((x,y)=>x.price-y.price);if(sort.value==='high')a.sort((x,y)=>y.price-x.price);if(sort.value==='rating')a.sort((x,y)=>y.rating-x.rating);
 document.getElementById('count').textContent=a.length+' products';
 grid.innerHTML=a.map(p=>`<article class="card"><img class="pic" loading="lazy" src="${p.image}" alt="${p.name}"><div class="info"><div class="cat">${p.category}</div><div class="name">${p.name}</div><div class="price">₹${p.price.toLocaleString('en-IN')} <span class="mrp">₹${p.mrp.toLocaleString('en-IN')}</span><span class="off">${p.discount}% off</span></div><div class="rating">★ ${p.rating} · ${p.reviews.toLocaleString('en-IN')} reviews</div><button class="add" onclick="add()">Add to Cart</button></div></article>`).join('');
}
function add(){cart++;document.getElementById('cart').textContent=cart}render();
</script></body></html>
