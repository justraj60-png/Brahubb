<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRAHUBB Store</title>
<meta name="description" content="BRAHUBB online store">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111
}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:12px
}
.top{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}
.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:.5px
}
.search{
  flex:1;
  min-width:180px;
  padding:12px;
  border:1px solid #bbb;
  border-radius:8px
}
button{cursor:pointer}
.cartBtn{
  background:#111;
  color:#fff;
  border:0;
  border-radius:8px;
  padding:12px 16px;
  font-weight:700
}
.categories{
  max-width:1200px;
  margin:8px auto 0;
  display:flex;
  gap:8px;
  overflow:auto;
  padding:4px 0
}
.categories button{
  border:1px solid #ddd;
  background:#fff;
  padding:8px 14px;
  border-radius:20px;
  white-space:nowrap
}
main{
  max-width:1200px;
  margin:auto;
  padding:18px 12px
}
.hero{
  background:#111;
  color:#fff;
  padding:35px 22px;
  border-radius:14px;
  margin-bottom:20px
}
.hero h1{
  margin:0 0 8px;
  font-size:34px
}
.hero p{
  margin:0;
  opacity:.85
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px
}
.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden
}
.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block
}
.info{
  padding:12px
}
.name{
  font-weight:700;
  margin-bottom:7px
}
.price{
  font-size:20px;
  font-weight:800
}
.mrp{
  color:#888;
  text-decoration:line-through;
  margin-left:5px;
  font-size:13px
}
.add{
  width:100%;
  margin-top:10px;
  padding:11px;
  border:0;
  border-radius:8px;
  background:#111;
  color:#fff;
  font-weight:700
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
  padding:15px
}
.modalBox{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:14px;
  padding:20px
}
.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px
}
.modal img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:10px
}
.qty{
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 0
}
.qty button{
  width:35px;
  height:35px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:6px
}
.field{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:8px
}
.primary{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#111;
  color:#fff;
  font-weight:800;
  margin-top:8px
}
.secondary{
  width:100%;
  padding:13px;
  border:1px solid #111;
  border-radius:8px;
  background:#fff;
  color:#111;
  font-weight:800;
  margin-top:8px
}
.cartItem{
  display:flex;
  gap:10px;
  border-bottom:1px solid #ddd;
  padding:12px 0
}
.cartItem img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:8px
}
.cartItemInfo{
  flex:1
}
.total{
  font-size:22px;
  font-weight:900;
  margin:15px 0
}
.empty{
  text-align:center;
  padding:30px;
  color:#777
}
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:12px 18px;
  border-radius:8px;
  display:none;
  z-index:50
}
footer{
  text-align:center;
  padding:30px;
  color:#777
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .card img{height:180px}
  .hero h1{font-size:28px}
}
@media(max-width:420px){
  .grid{grid-template-columns:1fr 1fr}
  .card img{height:150px}
  .logo{font-size:21px}
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">BRAHUBB</div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search products..."
      oninput="renderProducts()"
    >

    <button class="cartBtn" onclick="openCart()">
      🛒 Cart <span id="cartCount">0</span>
    </button>
  </div>

  <div class="categories">
    <button onclick="setCategory('All')">All</button>
    <button onclick="setCategory('Electronics')">Electronics</button>
    <button onclick="setCategory('Fashion')">Fashion</button>
    <button onclick="setCategory('Beauty')">Beauty</button>
    <button onclick="setCategory('Home')">Home</button>
    <button onclick="setCategory('Bags')">Bags</button>
    <button onclick="setCategory('Shoes')">Shoes</button>
  </div>
</header>

<main>

<section class="hero">
  <h1>Shop on BRAHUBB</h1>
  <p>Fashion, electronics, lifestyle and more.</p>
</section>

<div id="productGrid" class="grid"></div>

</main>

<footer>
  © 2026 BRAHUBB — All rights reserved.
</footer>

<div id="modal" class="modal">
  <div class="modalBox">
    <button class="close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>

const products = [

{
 id:1,
 name:"Smartphone",
 category:"Electronics",
 price:14999,
 mrp:19999,
 image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80",
 description:"Modern smartphone with a large display and powerful performance."
},

{
 id:2,
 name:"Wireless Headphones",
 category:"Electronics",
 price:1999,
 mrp:3999,
 image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80",
 description:"Comfortable wireless headphones with clear sound."
},

{
 id:3,
 name:"Smart Watch",
 category:"Electronics",
 price:2999,
 mrp:5999,
 image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80",
 description:"Smart watch for everyday fitness and notifications."
},

{
 id:4,
 name:"Sneakers",
 category:"Shoes",
 price:2499,
 mrp:4999,
 image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80",
 description:"Stylish everyday sneakers."
},

{
 id:5,
 name:"Backpack",
 category:"Bags",
 price:1299,
 mrp:2499,
 image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=80",
 description:"Spacious backpack for travel, college and daily use."
},

{
 id:6,
 name:"Sunglasses",
 category:"Fashion",
 price:799,
 mrp:1599,
 image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80",
 description:"Classic sunglasses with a modern look."
},

{
 id:7,
 name:"Classic T-Shirt",
 category:"Fashion",
 price:699,
 mrp:1299,
 image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80",
 description:"Comfortable everyday casual T-shirt."
},

{
 id:8,
 name:"Running Shoes",
 category:"Shoes",
 price:1899,
 mrp:3499,
 image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80",
 description:"Lightweight running shoes for everyday activity."
},

{
 id:9,
 name:"Laptop",
 category:"Electronics",
 price:45999,
 mrp:55999,
 image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=800&q=80",
 description:"Powerful laptop for work, study and entertainment."
},

{
 id:10,
 name:"Travel Bag",
 category:"Bags",
 price:1599,
 mrp:2999,
 image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=80",
 description:"Large travel bag with practical storage."
},

{
 id:11,
 name:"Bluetooth Speaker",
 category:"Electronics",
 price:1499,
 mrp:2499,
 image:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=800&q=80",
 description:"Portable Bluetooth speaker with powerful sound."
},

{
 id:12,
 name:"Camera",
 category:"Electronics",
 price:32999,
 mrp:39999,
 image:"https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=800&q=80",
 description:"Digital camera for photography and video."
},

{
 id:13,
 name:"Face Care Set",
 category:"Beauty",
 price:999,
 mrp:1599,
 image:"https://images.unsplash.com/photo-1556228578-8c89e6adf883?auto=format&fit=crop&w=800&q=80",
 description:"Daily personal care essentials."
},

{
 id:14,
 name:"Home Decor",
 category:"Home",
 price:899,
 mrp:1499,
 image:"https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=800&q=80",
 description:"Modern home decoration item."
}

];

let cart = JSON.parse(localStorage.getItem("brahubb_cart") || "[]");
let selectedCategory = "All";

function money(value){
  return "₹" + value.toLocaleString("en-IN");
}

function saveCart(){
  localStorage.setItem("brahubb_cart", JSON.stringify(cart));

  let count = cart.reduce((sum,item)=>sum + item.qty,0);

  document.getElementById("cartCount").textContent = count;
}

function setCategory(category){
  selectedCategory = category;
  renderProducts();
}

function renderProducts(){

  const grid = document.getElementById("productGrid");
  const search = document.getElementById("search").value.toLowerCase();

  const filtered = products.filter(p => {

    const categoryMatch =
      selectedCategory === "All" ||
      p.category === selectedCategory;

    const searchMatch =
      p.name.toLowerCase().includes(search) ||
      p.category.toLowerCase().includes(search);

    return categoryMatch && searchMatch;

  });

  if(filtered.length === 0){

    grid.innerHTML =
      '<div class="empty">No products found.</div>';

    return;
  }

  grid.innerHTML = filtered.map(p => `

    <div class="card">

      <img
        src="${p.image}"
        alt="${p.name}"
        loading="lazy"
        onclick="showProduct(${p.id})"
      >

      <div class="info">

        <div class="name">${p.name}</div>

        <div>
          <span class="price">${money(p.price)}</span>
          <span class="mrp">${money(p.mrp)}</span>
        </div>

        <button
          class="add"
          onclick="addToCart(${p.id})"
        >
          Add to Cart
        </button>

      </div>

    </div>

  `).join("");

}

function showProduct(id){

  const p = products.find(x => x.id === id);

  document.getElementById("modalContent").innerHTML = `

    <img src="${p.image}" alt="${p.name}">

    <h2>${p.name}</h2>

    <p>${p.description}</p>

    <h2>${money(p.price)}</h2>

    <p>
      <span style="text-decoration:line-through;color:#888">
        ${money(p.mrp)}
      </span>
    </p>

    <button
      class="primary"
      onclick="addToCart(${p.id});closeModal()"
    >
      Add to Cart
    </button>

  `;

  document.getElementById("modal").style.display = "flex";
}

function addToCart(id){

  const existing = cart.find(x => x.id === id);

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      id:id,
      qty:1
    });
  }

  saveCart();
  toast("Added to cart");
}

function openCart(){

  let html = "<h2>Your Cart</h2>";

  if(cart.length === 0){

    html += `
      <div class="empty">
        Your cart is empty.
      </div>
    `;

  }else{

    let total = 0;

    cart.forEach(item => {

      const p = products.find(x => x.id === item.id);

      const subtotal = p.price * item.qty;

      total += subtotal;

      html += `

        <div class="cartItem">

          <img src="${p.image}" alt="${p.name}">

          <div class="cartItemInfo">

            <strong>${p.name}</strong>

            <div>${money(p.price)}</div>

            <div class="qty">

              <button onclick="changeQty(${p.id},-1)">−</button>

              <span>${item.qty}</span>

              <button onclick="changeQty(${p.id},1)">+</button>

            </div>

            <strong>
              ${money(subtotal)}
            </strong>

          </div>

        </div>

      `;

    });

    html += `

      <div class="total">
        Total: ${money(total)}
      </div>

      <button
        class="primary"
        onclick="checkout()"
      >
        Proceed to Checkout
      </button>

    `;

  }

  document.getElementById("modalContent").innerHTML = html;

  document.getElementById("modal").style.display = "flex";
}

function changeQty(id,change){

  const item = cart.find(x => x.id === id);

  if(!item) return;

  item.qty += change;

  if(item.qty <= 0){
    cart = cart.filter(x => x.id !== id);
  }

  saveCart();
  openCart();
}

function checkout(){

  if(cart.length === 0){
    toast("Cart is empty");
    return;
  }

  document.getElementById("modalContent").innerHTML = `

    <h2>Checkout</h2>

    <input
      id="customerName"
      class="field"
      placeholder="Full Name"
    >

    <input
      id="customerPhone"
      class="field"
      placeholder="Mobile Number"
      type="tel"
    >

    <textarea
      id="customerAddress"
      class="field"
      placeholder="Complete Delivery Address"
      rows="4"
    ></textarea>

    <h3>Payment Method</h3>

    <button
      class="primary"
      onclick="placeCODOrder()"
    >
      Cash on Delivery
    </button>

    <button
      class="secondary"
      onclick="onlinePayment()"
    >
      Pay Online
    </button>

    <p style="font-size:12px;color:#777;margin-top:12px">
      Online payment gateway will require a real payment gateway
      and secure backend connection.
    </p>

  `;

}

function placeCODOrder(){

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  if(!name || !phone || !address){

    toast("Please fill all details");
    return;

  }

  const order = {

    orderId:
      "BRH" +
      Date.now(),

    customer:{
      name:name,
      phone:phone,
      address:address
    },

    items:cart,

    status:"Pending",

    payment:"Cash on Delivery",

    createdAt:new Date().toISOString()

  };

  localStorage.setItem(
    "brahubb_last_order",
    JSON.stringify(order)
  );

  cart = [];

  saveCart();

  document.getElementById("modalContent").innerHTML = `

    <h2>Order Details Saved</h2>

    <p>
      Order ID:
      <strong>${order.orderId}</strong>
    </p>

    <p>
      Payment:
      <strong>Cash on Delivery</strong>
    </p>

    <p style="color:#777">
      This current version stores the order in this browser.
      A real online store needs a backend/database to receive
      orders from customers.
    </p>

    <button
      class="primary"
      onclick="closeModal()"
    >
      Continue Shopping
    </button>

  `;

}

function onlinePayment(){

  alert(
    "Real online payment is not connected yet. " +
    "Do not treat this as a successful payment."
  );

}

function closeModal(){

  document.getElementById("modal").style.display = "none";

}

function toast(message){

  const t = document.getElementById("toast");

  t.textContent = message;

  t.style.display = "block";

  setTimeout(()=>{
    t.style.display = "none";
  },1800);

}

document.getElementById("modal").addEventListener(
  "click",
  function(e){

    if(e.target === this){
      closeModal();
    }

  }
);

saveCart();
renderProducts();

</script>

</body>
</html>
