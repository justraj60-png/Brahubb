<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRAHUBB — Online Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px}
.top{max-width:1200px;margin:auto;display:flex;gap:12px;align-items:center}.brand{font-size:25px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.search{flex:1;padding:12px 14px;border:1px solid #bbb;border-radius:6px;font-size:15px}.cart{border:0;background:#111;color:#fff;padding:12px 15px;border-radius:6px;font-weight:700}
nav{max-width:1200px;margin:10px auto 0;display:flex;gap:8px;overflow:auto;padding-bottom:2px}nav button{border:1px solid #ddd;background:#fff;padding:9px 13px;border-radius:20px;white-space:nowrap}
main{max-width:1200px;margin:18px auto;padding:0 12px}.hero{background:#fff;padding:22px;border-radius:10px;margin-bottom:16px}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:9px;overflow:hidden;border:1px solid #e4e4e4;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px #0001}.pic{width:100%;height:220px;object-fit:cover;background:#eee}.info{padding:11px}.cat{font-size:12px;color:#777}.name{font-weight:700;margin:5px 0;line-height:1.3}.rating{font-size:13px;color:#555}.price{font-weight:800;margin-top:8px}.mrp{text-decoration:line-through;color:#999;font-weight:400;font-size:13px;margin-left:5px}.off{color:#188038;font-size:12px;margin-left:4px}.add{width:100%;margin-top:10px;padding:10px;border:0;border-radius:6px;background:#111;color:#fff;font-weight:700}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}.box{background:#fff;max-width:720px;width:100%;max-height:92vh;overflow:auto;border-radius:12px;padding:18px}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}.row{display:flex;gap:20px}.row img{width:45%;max-height:430px;object-fit:cover;border-radius:8px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:34px;height:34px}.line{border-top:1px solid #ddd;padding:12px 0}.field{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:6px}.primary{background:#111;color:#fff;border:0;padding:12px 16px;border-radius:6px;font-weight:700;width:100%}
@media(max-width:650px){.top{flex-wrap:wrap}.brand{width:100%}.search{order:3;flex-basis:100%}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.pic{height:180px}.row{flex-direction:column}.row img{width:100%;max-height:350px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">BRAHUBB</div><input id="search" class="search" placeholder="Search products..." oninput="render()"><button class="cart" onclick="openCart()">Cart (<span id="count">0</span>)</button></div><nav id="cats"></nav></header>
<main><section class="hero"><h1>Shop on BRAHUBB</h1><p>Products, cart and order placement in one place.</p></section><div id="grid" class="grid"></div></main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="box" class="box"></div></div>
<script>
const SUPABASE_URL="PASTE_SUPABASE_URL";
const SUPABASE_ANON_KEY="PASTE_SUPABASE_ANON_KEY";
let products=[], cart=JSON.parse(localStorage.brahubbCart||"[]");
const demo=[
["Smartphone","Electronics",14999,19999,"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=800"],
["Wireless Headphones","Electronics",1999,3999,"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800"],
["Sneakers","Fashion",2499,4999,"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800"],
["Backpack","Fashion",1299,2499,"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800"],
["Smart Watch","Electronics",2999,5999,"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800"],
["Sunglasses","Fashion",799,1599,"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=800"]
].map((x,i)=>({id:"demo"+i,name:x[0],category:x[1],price:x[2],mrp:x[3],image:x[4],rating:4.2,reviews:120}));
async function loadProducts(){
 try{if(SUPABASE_URL.startsWith("http")&&!SUPABASE_ANON_KEY.startsWith("PASTE_")){
 const r=await fetch(SUPABASE_URL+"/rest/v1/products?select=*&active=eq.true&order=created_at.desc",{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY}});
 if(r.ok){products=await r.json(); if(products.length)return render();}
 }}catch(e){}
 products=demo; render();
}
function cats(){let c=[...new Set(products.map(p=>p.category))];document.getElementById("cats").innerHTML='<button onclick="filterCat(\'\')">All</button>'+c.map(x=>`<button onclick="filterCat(${JSON.stringify(x)})">${x}</button>`).join("")}
let activeCat="";
function filterCat(x){activeCat=x;render()}
function render(){cats();let q=document.getElementById("search").value.toLowerCase();let a=products.filter(p=>(!activeCat||p.category===activeCat)&&p.name.toLowerCase().includes(q));document.getElementById("grid").innerHTML=a.map(p=>`<article class="card" onclick="showProduct('${p.id}')"><img class="pic" src="${p.image}" alt=""><div class="info"><div class="cat">${p.category}</div><div class="name">${p.name}</div><div class="rating">★ ${p.rating||4.2} · ${p.reviews||0} reviews</div><div class="price">₹${Number(p.price).toLocaleString('en-IN')} <span class="mrp">₹${Number(p.mrp||p.price).toLocaleString('en-IN')}</span></div><button class="add" onclick="event.stopPropagation();add('${p.id}')">Add to Cart</button></div></article>`).join("")}
function save(){localStorage.brahubbCart=JSON.stringify(cart);document.getElementById("count").textContent=cart.reduce((a,x)=>a+x.qty,0)}
function add(id){let x=cart.find(x=>String(x.id)===String(id));if(x)x.qty++;else cart.push({id,qty:1});save();showToast("Added to cart");}
function showToast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:8px;z-index:99;font-weight:700";document.body.appendChild(t)}t.textContent=msg;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",1400)}
function showProduct(id){let p=products.find(x=>String(x.id)===String(id));if(!p)return;open(`<button class="close" onclick="closeModal()">×</button><div class="row"><img src="${p.image}"><div><h2>${p.name}</h2><p>${p.category}</p><h2>₹${Number(p.price).toLocaleString('en-IN')}</h2><p>★ ${p.rating||4.2} · ${p.reviews||0} reviews</p><p>Product available for order.</p><button class="primary" onclick="add('${p.id}');closeModal()">Add to Cart</button></div></div>`)}
function openCart(){let items=cart.map(c=>({c,p:products.find(x=>String(x.id)===String(c.id))})).filter(x=>x.p);let total=items.reduce((s,x)=>s+x.p.price*x.c.qty,0);open(`<button class="close" onclick="closeModal()">×</button><h2>Your Cart</h2>${items.length?items.map(x=>`<div class="line"><b>${x.p.name}</b><br>₹${x.p.price} × ${x.c.qty}<div class="qty"><button onclick="change('${x.p.id}',-1);openCart()">−</button><span>${x.c.qty}</span><button onclick="change('${x.p.id}',1);openCart()">+</button></div></div>`).join("")+`<h2>Total: ₹${total.toLocaleString('en-IN')}</h2><button class="primary" onclick="checkout()">Place Order</button>`:"<p>Your cart is empty.</p>"}`)}
function change(id,d){let x=cart.find(x=>String(x.id)===String(id));if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y!==x);save()}
function checkout(){let total=cart.reduce((s,c)=>{let p=products.find(x=>String(x.id)===String(c.id));return s+(p?p.price*c.qty:0)},0);open(`<button class="close" onclick="closeModal()">×</button><h2>Delivery Details</h2><input id="n" class="field" placeholder="Full name"><input id="ph" class="field" placeholder="Mobile number"><textarea id="ad" class="field" placeholder="Full delivery address"></textarea><button class="primary" onclick="placeOrder(${total})">Confirm Order (COD)</button>`)}
async function placeOrder(total){let name=document.getElementById("n").value.trim(),phone=document.getElementById("ph").value.trim(),address=document.getElementById("ad").value.trim();if(!name||!phone||!address)return alert("Please fill all details");let order={order_no:"BRH"+Date.now(),customer_name:name,phone,address,total,status:"pending",items:cart};let saved=false;try{if(SUPABASE_URL.startsWith("http")&&!SUPABASE_ANON_KEY.startsWith("PASTE_")){let r=await fetch(SUPABASE_URL+"/rest/v1/orders",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(order)});saved=r.ok}}catch(e){}localStorage.brahubbLastOrder=JSON.stringify(order);cart=[];save();open(`<h2>Order Received</h2><p>Your order number is <b>${order.order_no}</b>.</p><p>Status: Pending</p><p>${saved?"Your order has been sent to the store database.":"Demo mode: connect Supabase to receive it in the admin panel."}</p><button class="primary" onclick="closeModal()">Continue Shopping</button>`)}
function open(x){document.getElementById("box").innerHTML=x;document.getElementById("modal").style.display="flex"}function closeModal(){document.getElementById("modal").style.display="none"}save();loadProducts();
</script></body></html>
